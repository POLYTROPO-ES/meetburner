[package]
name = "meetburner"
version = "0.3.1"
edition = "2021"

[lib]
name = "meetburner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
ab_glyph = "0.2"
# Webcam capture for the overlay mode (M7, ADR-0021). `decoding` is required: most webcams
# expose MJPEG at high resolutions, and without it the frame cannot be turned into RGB.
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native", "decoding"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading"] }

# Raw `open`/`ioctl`/`write` for the v4l2loopback producer (M5). The V4L2 structs live in
# `camera/sink/linux.rs`: libc has no videodev2 bindings.
[target."cfg(target_os = \"linux\")".dependencies]
libc = "0.2"
