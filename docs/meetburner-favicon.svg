<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MeetBurner favicon</title>
  <desc id="desc">A stopwatch and dollar bill wrapped in orange flames, representing time and money burning during meetings.</desc>
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4B24"/>
      <stop offset="0.55" stop-color="#FF6A18"/>
      <stop offset="1" stop-color="#FFB52E"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7E9"/>
      <stop offset="1" stop-color="#FFC98B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#171717"/>
  <!-- Flame behind the timepiece -->
  <path d="M310 72c19 43-5 69-27 92-20 21-31 42-24 67 12-20 29-29 42-43 6 30 28 43 30 73 2 23-9 42-24 57 43-11 76-47 74-91-2-39-29-56-31-88-2-23 7-41 17-58-24 8-41 25-57 46z" fill="url(#fire)"/>
  <path d="M365 176c4 24 22 36 25 59 3 24-8 45-25 60 31-8 52-31 53-60 1-25-16-38-20-58-3-13 1-25 6-36-17 8-29 19-39 35z" fill="#FF9B24"/>
  <!-- Stopwatch body -->
  <rect x="204" y="73" width="70" height="27" rx="9" fill="url(#paper)" transform="rotate(-12 239 86)"/>
  <rect x="225" y="95" width="34" height="24" rx="7" fill="#FFF0D9" transform="rotate(-12 242 107)"/>
  <circle cx="226" cy="250" r="139" fill="#171717" stroke="url(#paper)" stroke-width="21"/>
  <circle cx="226" cy="250" r="116" fill="#202020"/>
  <!-- clock ticks -->
  <g stroke="#FFF0D9" stroke-width="12" stroke-linecap="round">
    <path d="M226 151v17"/><path d="M127 250h17"/><path d="M226 332v17"/>
  </g>
  <!-- hands -->
  <path d="M226 250l-48-34" stroke="#FF6A18" stroke-width="15" stroke-linecap="round"/>
  <path d="M226 250l59-72" stroke="#FF9B24" stroke-width="15" stroke-linecap="round"/>
  <circle cx="226" cy="250" r="11" fill="#FFF0D9"/>
  <!-- Burning banknote -->
  <path d="M258 302l153-54 49 139-153 54c-8-9-18-12-29-8l-30-85c10-11 13-25 10-46z" fill="url(#paper)" stroke="#171717" stroke-width="10" stroke-linejoin="round"/>
  <path d="M285 313l123-43 35 101-123 43c-6-7-12-10-20-9l-22-63c8-9 10-18 7-29z" fill="#171717"/>
  <circle cx="354" cy="346" r="38" fill="url(#fire)"/>
  <path d="M365 322c-5-5-13-7-20-4-8 3-10 13-3 18 5 4 16 3 20 10 5 8-1 17-10 19-8 2-17-1-22-7" fill="none" stroke="#FFF7E9" stroke-width="9" stroke-linecap="round"/>
  <path d="M353 315v61" stroke="#FFF7E9" stroke-width="8" stroke-linecap="round"/>
  <!-- small flame accents -->
  <path d="M414 205c-2 18 11 25 10 39-1 9-6 17-14 22 18-3 30-17 28-33-1-12-11-18-12-29-1-8 2-14 5-20-9 5-14 12-17 21z" fill="url(#fire)"/>
</svg>