name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web

  rust:
    name: Desktop camera (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Provide the frontend dist for generate_context
        shell: bash
        run: mkdir -p apps/web/dist && printf '<!doctype html><title>MeetBurner</title>' > apps/web/dist/index.html
      - name: Format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Lint
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  native:
    name: Windows camera filter (CMake + CTest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native/vcam-windows -B native/vcam-windows/build -A x64
      - name: Build
        run: cmake --build native/vcam-windows/build --config Release
      - name: Test
        run: ctest --test-dir native/vcam-windows/build -C Release --output-on-failure
