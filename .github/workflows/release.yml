name: Release

# ADR-0025: the tag is the release. Nothing is published from an untagged commit.
# `workflow_dispatch` is the dry run: it builds (and signs, if the secrets exist) without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tests + version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - name: Tag must match the app version
        id: version
        run: |
          set -euo pipefail
          tauri=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          desktop=$(node -p "require('./apps/desktop/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n1)
          echo "tauri.conf.json=$tauri package.json=$desktop Cargo.toml=$cargo"
          if [ "$tauri" != "$desktop" ] || [ "$tauri" != "$cargo" ]; then
            echo "::error::The app version must be the same in tauri.conf.json, package.json and Cargo.toml"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$tauri" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $tauri"
            exit 1
          fi
          echo "version=$tauri" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (NSIS, MSI, portable)
    needs: check
    runs-on: windows-latest
    # `actions: read` lets the SignPath action download the uploaded unsigned artifact.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      SIGNING_ROUTE: ${{ vars.SIGNING_ROUTE }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
    outputs:
      signed: ${{ steps.route.outputs.signed }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      # No PFX: since June 2023 a code-signing key lives in an HSM. The route is a repository
      # variable (ADR-0027, ADR-0039); forks and dry runs without credentials stay unsigned.
      # The order is fixed: DLLs before `tauri build` (build.rs embeds the DirectShow DLL),
      # then the exe, then the installers built from that signed exe.
      - name: Choose the signing route
        id: route
        run: |
          $route = $env:SIGNING_ROUTE
          if (-not $route) { $route = 'unsigned' }
          if ($route -eq 'signpath') {
            $missing = @(
              $env:SIGNPATH_API_TOKEN,
              $env:SIGNPATH_ORGANIZATION_ID,
              $env:SIGNPATH_PROJECT_SLUG,
              $env:SIGNPATH_SIGNING_POLICY_SLUG,
              $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
            ) | Where-Object { -not $_ }
            if ($missing) {
              Write-Host '::warning::SIGNING_ROUTE=signpath but the SignPath settings are incomplete: building unsigned'
              $route = 'unsigned'
            }
          }
          if ($route -eq 'artifact-signing') {
            $missing = @(
              $env:AZURE_CLIENT_ID,
              $env:AZURE_CLIENT_SECRET,
              $env:AZURE_TENANT_ID,
              $env:AZURE_ARTIFACT_SIGNING_ENDPOINT,
              $env:AZURE_ARTIFACT_SIGNING_ACCOUNT,
              $env:AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE
            ) | Where-Object { -not $_ }
            if ($missing) {
              Write-Host '::warning::SIGNING_ROUTE=artifact-signing but the Azure settings are incomplete: building unsigned'
              $route = 'unsigned'
            }
          }
          if ($route -notin @('signpath', 'artifact-signing', 'unsigned')) {
            Write-Host "::warning::Unknown SIGNING_ROUTE '$route': building unsigned"
            $route = 'unsigned'
          }
          "route=$route" >> $env:GITHUB_OUTPUT
          if ($route -eq 'unsigned') {
            "signed=false" >> $env:GITHUB_OUTPUT
          } else {
            "signed=true" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Signing route: $route"

      - name: Locate signtool
        if: steps.route.outputs.signed == 'true'
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Build the camera drivers
        run: |
          cmake -S native/vcam-windows -B native/vcam-windows/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build native/vcam-windows/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'cmake build failed' }

      - name: Install artifact-signing-cli
        if: steps.route.outputs.route == 'artifact-signing'
        run: cargo install artifact-signing-cli --locked

      - name: Sign the camera drivers (Azure Artifact Signing)
        if: steps.route.outputs.route == 'artifact-signing'
        run: |
          artifact-signing-cli -e $env:AZURE_ARTIFACT_SIGNING_ENDPOINT `
            -a $env:AZURE_ARTIFACT_SIGNING_ACCOUNT `
            -c $env:AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE `
            -d MeetBurner `
            native/vcam-windows/build/Release/MeetBurnerCamera.dll `
            native/vcam-windows/build/Release/MeetBurnerMfCamera.dll
          if ($LASTEXITCODE -ne 0) { throw 'artifact-signing-cli failed for the camera drivers' }

      - name: Upload the camera drivers for SignPath
        id: upload-drivers
        if: steps.route.outputs.route == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: meetburner-camera-drivers-unsigned
          if-no-files-found: error
          retention-days: 1
          path: |
            native/vcam-windows/build/Release/MeetBurnerCamera.dll
            native/vcam-windows/build/Release/MeetBurnerMfCamera.dll

      # The SignPath artifact configuration must describe a <zip-file> that signs every
      # PE file in the archive; the same configuration is reused for the three requests.
      - name: Sign the camera drivers (SignPath)
        if: steps.route.outputs.route == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-drivers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-drivers

      - name: Put the signed camera drivers back
        if: steps.route.outputs.route == 'signpath'
        run: |
          $signed = Get-ChildItem -Recurse -File "${{ runner.temp }}/signed-drivers" -Filter '*.dll'
          foreach ($name in @('MeetBurnerCamera.dll', 'MeetBurnerMfCamera.dll')) {
            $file = $signed | Where-Object Name -eq $name | Select-Object -First 1
            if (-not $file) { throw "$name was not returned by SignPath" }
            Copy-Item $file.FullName "native/vcam-windows/build/Release/$name" -Force
          }

      - name: Verify the signed camera drivers
        if: steps.route.outputs.signed == 'true'
        run: |
          if (-not $env:SIGNTOOL_PATH) { throw 'SIGNTOOL_PATH is not set' }
          foreach ($dll in @('MeetBurnerCamera.dll', 'MeetBurnerMfCamera.dll')) {
            & $env:SIGNTOOL_PATH verify /pa /v "native/vcam-windows/build/Release/$dll"
            if ($LASTEXITCODE -ne 0) { throw "$dll is not signed" }
          }

      - name: Build the app and the installers (unsigned)
        if: steps.route.outputs.route == 'unsigned'
        run: |
          npm run build:desktop -- --bundles nsis,msi
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

      - name: Build the app and the installers (Azure Artifact Signing)
        if: steps.route.outputs.route == 'artifact-signing'
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'artifact-signing.json'
          @{
            bundle = @{
              windows = @{
                signCommand = "artifact-signing-cli -e $env:AZURE_ARTIFACT_SIGNING_ENDPOINT -a $env:AZURE_ARTIFACT_SIGNING_ACCOUNT -c $env:AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE -d MeetBurner %1"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content $config -Encoding utf8
          npm run build:desktop -- --bundles nsis,msi --config $config
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

      # SignPath signs after the fact, so this route builds and signs in three requests.
      - name: Build the executable (SignPath)
        if: steps.route.outputs.route == 'signpath'
        run: |
          npm run build:desktop -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

      - name: Upload the executable for SignPath
        id: upload-exe
        if: steps.route.outputs.route == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: meetburner-exe-unsigned
          if-no-files-found: error
          retention-days: 1
          path: apps/desktop/src-tauri/target/release/meetburner.exe

      - name: Sign the executable (SignPath)
        if: steps.route.outputs.route == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-exe

      - name: Put the signed executable back
        if: steps.route.outputs.route == 'signpath'
        run: |
          $signed = Get-ChildItem -Recurse -File "${{ runner.temp }}/signed-exe" -Filter 'meetburner.exe' |
            Select-Object -First 1
          if (-not $signed) { throw 'meetburner.exe was not returned by SignPath' }
          Copy-Item $signed.FullName 'apps/desktop/src-tauri/target/release/meetburner.exe' -Force

      - name: Build the installers from the signed executable (SignPath)
        if: steps.route.outputs.route == 'signpath'
        run: |
          npm run tauri -w @meetburner/desktop -- bundle --bundles nsis,msi
          if ($LASTEXITCODE -ne 0) { throw 'tauri bundle failed' }

      - name: Upload the installers for SignPath
        id: upload-installers
        if: steps.route.outputs.route == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: meetburner-installers-unsigned
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Sign the installers (SignPath)
        if: steps.route.outputs.route == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-installers

      - name: Put the signed installers back
        if: steps.route.outputs.route == 'signpath'
        run: |
          $signed = Get-ChildItem -Recurse -File "${{ runner.temp }}/signed-installers"
          $nsis = $signed | Where-Object Extension -eq '.exe' | Select-Object -First 1
          $msi = $signed | Where-Object Extension -eq '.msi' | Select-Object -First 1
          if (-not $nsis) { throw 'the NSIS installer was not returned by SignPath' }
          if (-not $msi) { throw 'the MSI installer was not returned by SignPath' }
          Copy-Item $nsis.FullName (Join-Path 'apps/desktop/src-tauri/target/release/bundle/nsis' $nsis.Name) -Force
          Copy-Item $msi.FullName (Join-Path 'apps/desktop/src-tauri/target/release/bundle/msi' $msi.Name) -Force

      # The Store installer is the same signed exe with the offline WebView2 runtime and the
      # Polytropo publisher (ADR-0039). `tauri bundle` reuses the signed exe; the normal NSIS
      # installer is saved and restored so both files survive.
      - name: Build the Microsoft Store installer
        run: |
          $version = '${{ needs.check.outputs.version }}'
          $route = '${{ steps.route.outputs.route }}'
          $nsisDir = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $normal = Get-ChildItem "$nsisDir/*.exe" | Select-Object -First 1
          if (-not $normal) { throw 'the normal NSIS installer was not built' }
          $saved = Join-Path $env:RUNNER_TEMP $normal.Name
          Copy-Item $normal.FullName $saved -Force
          Remove-Item $normal.FullName -Force
          $arguments = @(
            'run', 'tauri', '-w', '@meetburner/desktop', '--',
            'bundle', '--bundles', 'nsis',
            '--config', 'src-tauri/tauri.microsoftstore.conf.json'
          )
          if ($route -eq 'artifact-signing') {
            $arguments += @('--config', (Join-Path $env:RUNNER_TEMP 'artifact-signing.json'))
          }
          & npm @arguments
          if ($LASTEXITCODE -ne 0) { throw 'the Microsoft Store bundle failed' }
          $store = Get-ChildItem "$nsisDir/*.exe" | Select-Object -First 1
          if (-not $store) { throw 'the Microsoft Store installer was not built' }
          Move-Item $store.FullName "MeetBurner_${version}_x64_store-setup.exe" -Force
          Copy-Item $saved (Join-Path $nsisDir $normal.Name) -Force

      - name: Upload the store installer for SignPath
        id: upload-store
        if: steps.route.outputs.route == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: meetburner-store-installer-unsigned
          if-no-files-found: error
          retention-days: 1
          path: MeetBurner_*_store-setup.exe

      - name: Sign the store installer (SignPath)
        if: steps.route.outputs.route == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-store.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-store

      - name: Put the signed store installer back
        if: steps.route.outputs.route == 'signpath'
        run: |
          $signed = Get-ChildItem -Recurse -File "${{ runner.temp }}/signed-store" -Filter '*_store-setup.exe' |
            Select-Object -First 1
          if (-not $signed) { throw 'the store installer was not returned by SignPath' }
          Copy-Item $signed.FullName $signed.Name -Force

      - name: Verify the signed application and installers
        if: steps.route.outputs.signed == 'true'
        run: |
          if (-not $env:SIGNTOOL_PATH) { throw 'SIGNTOOL_PATH is not set' }
          $files = @('apps/desktop/src-tauri/target/release/meetburner.exe') +
            @(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' | ForEach-Object FullName) +
            @(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/msi/*.msi' | ForEach-Object FullName) +
            @(Get-ChildItem 'MeetBurner_*_store-setup.exe' | ForEach-Object FullName)
          foreach ($file in $files) {
            & $env:SIGNTOOL_PATH verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "$file is not signed" }
          }

      - name: Assemble the portable builds
        run: |
          $version = '${{ needs.check.outputs.version }}'
          $single = "MeetBurner_${version}_x64.exe"
          Copy-Item 'apps/desktop/src-tauri/target/release/meetburner.exe' $single
          $stage = Join-Path $env:RUNNER_TEMP "MeetBurner_${version}_portable_x64"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'resources') | Out-Null
          Copy-Item $single $stage
          Copy-Item 'apps/desktop/src-tauri/target/release/resources/*.dll' (Join-Path $stage 'resources')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "MeetBurner_${version}_portable_x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            MeetBurner_*_x64.exe
            MeetBurner_*_portable_x64.zip
            MeetBurner_*_store-setup.exe

  linux:
    name: Linux (deb, AppImage)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libv4l-dev libudev-dev clang libclang-dev libfuse2
      - run: npm ci
      - name: Build the bundles
        run: npm run build:desktop -- --bundles deb,appimage
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS (universal DMG, unsigned)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: macos
      - run: npm ci
      - name: Build the universal DMG
        run: npm run build:desktop -- --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  publish:
    name: Publish the release
    needs: [check, windows, linux, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Only the final artifacts: the unsigned DLL/exe/installer archives that SignPath uses
      # as input must never become release assets.
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist/windows

      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist/linux

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist/macos

      - name: Checksums
        run: |
          # Each artifact keeps its own folder layout (linux: deb/ + appimage/, windows: apps/…),
          # so collect the files into one flat folder: sha256sum and the release upload both
          # need plain file names, and SHA256SUMS.txt must list the asset names users download.
          mkdir -p out
          find dist -type f -exec cp -t out {} +
          (cd out && sha256sum ./*) > SHA256SUMS.txt
          mv SHA256SUMS.txt out/

      - name: Create the draft release and upload the assets
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A published release is immutable: a re-run of the tag must not replace the
            # binaries the Store (or a user) already points at.
            draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)
            if [ "$draft" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; bump the version and tag a new release"
              exit 1
            fi
            if gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -q '_store-setup\.exe$'; then
              echo "::error::Release $GITHUB_REF_NAME already has a store installer; the Store URL must never change"
              exit 1
            fi
            echo "Updating the existing draft $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft --verify-tag --generate-notes \
              --title "MeetBurner ${{ needs.check.outputs.version }}"
          fi

          # --clobber refreshes the normal assets. The Store installer is uploaded without it,
          # and only when the release has none (checked above): its URL is permanent.
          shopt -s nullglob
          normal=()
          store=()
          for file in out/*; do
            case "$file" in
              *_store-setup.exe) store+=("$file") ;;
              *) normal+=("$file") ;;
            esac
          done
          if [ ${#normal[@]} -gt 0 ]; then
            gh release upload "$GITHUB_REF_NAME" "${normal[@]}" --clobber
          fi
          if [ ${#store[@]} -gt 0 ]; then
            gh release upload "$GITHUB_REF_NAME" "${store[@]}"
          fi

      - name: Note the signing status
        env:
          SIGNED: ${{ needs.windows.outputs.signed }}
          ROUTE: ${{ needs.windows.outputs.route }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body -q .body > notes.md
          cat >> notes.md <<'NOTES'

          ### Portable builds

          Both files are the same `meetburner.exe`. Pick one:

          - `MeetBurner_*_x64.exe` — one file. The first *Register webcam for meets* writes `MeetBurnerCamera.v<N>.dll` next to the exe and registers that file, because Windows COM loads the filter from a path.
          - `MeetBurner_*_portable_x64.zip` — the same exe plus `resources\MeetBurnerCamera.dll`, already on disk. Nothing is extracted, so antivirus and SmartScreen see a plain application folder. Prefer this one if the single file is flagged: an exe that drops a DLL and registers a COM server matches dropper heuristics.

          ### Microsoft Store

          `MeetBurner_${{ needs.check.outputs.version }}_x64_store-setup.exe` is the same app and version with the WebView2 runtime included, for the Microsoft Store. The Store links to this exact file, so it is never replaced once published; a fix ships as a new version. The Store does not update EXE/MSI apps: update from the Store page or this release page.
          NOTES
          if [ "$SIGNED" = "true" ] && [ "$ROUTE" = "signpath" ]; then
            printf '\n> This build is code signed by SignPath Foundation (ADR-0027).\n' >> notes.md
          elif [ "$SIGNED" = "true" ] && [ "$ROUTE" = "artifact-signing" ]; then
            printf '\n> This build is code signed with an Azure Artifact Signing certificate (ADR-0039).\n' >> notes.md
          else
            printf '\n> This build is not code signed. Windows SmartScreen warns the first time; choose *More info*, then *Run anyway*.\n' >> notes.md
          fi
          printf '\n> The macOS build is not signed or notarized yet: Gatekeeper blocks it on first launch. Right-click the app, choose *Open*, then confirm. The virtual camera is not part of the macOS build (ADR-0028).\n' >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Publish
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
